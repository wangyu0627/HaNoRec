### model
model_name_or_path: Qwen-2.5-VL-3B-Instruct
adapter_name_or_path: checkpoints/microlens/sft_1_lora_qwenvl
image_max_pixels: 262144
trust_remote_code: true

### HaNoRec method
stage: dpo
do_train: true
finetuning_type: lora
create_new_adapter: true
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid
use_hanorec: true
hanorec_noise_sigma: 0.05
hanorec_beta_floor: 1.0e-6

### current repository data
dataset: microlens_vl_train_hanorec_1
dataset_dir: LLaMA-Factory/data
template: qwen2_vl
cutoff_len: 4096
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: checkpoints/microlens/hanorec_1_lora_qwenvl
logging_steps: 50
save_steps: 100
plot_loss: true
overwrite_output_dir: false
report_to: none

### paper-aligned training
per_device_train_batch_size: 4
dataloader_drop_last: true
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_steps: 0
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
include_num_input_tokens_seen: true
optim: adamw_torch
resume_from_checkpoint: null

